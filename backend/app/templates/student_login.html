{% extends "public_base.html" %}

{% block title %}Вход студента{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h2><i class="fas fa-sign-in-alt"></i> Вход студента</h2>

        {% if error %}
        <div style="padding: 1rem; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 12px; color: #f87171; margin-bottom: 1rem;">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <form action="/student/login" method="POST">
            <div class="form-group">
                <label for="login"><i class="fas fa-user"></i> Логин</label>
                <input type="text" id="login" name="login" required
                       placeholder="ivan_ivanov_1"
                       value="{{ login or '' }}"
                       autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Пароль</label>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••"
                       autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary">
                <i class="fas fa-arrow-right"></i> Войти
            </button>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255, 255, 255, 0.06);">
            <p style="font-size: 0.8rem; color: #52525b; text-align: center;">
                <a href="/student/register" style="color: #8b5cf6;">Нет аккаунта? Зарегистрируйтесь</a>
            </p>
            <p style="font-size: 0.8rem; color: #52525b; text-align: center; margin-top: 0.75rem;">
                <a href="/teacher/login" style="color: #8b5cf6;">Вход для преподавателя</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
