{% extends "admin_base.html" %}

{% block title %}Добавить преподавателей{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <a href="/admin/dashboard" class="back-link">
            <i class="fas fa-arrow-left"></i> Назад к списку
        </a>
        <h1><i class="fas fa-user-plus"></i> Добавить преподавателей</h1>
        <p class="page-subtitle">Каждое ФИО с новой строки. Логин и пароль сгенерируются автоматически.</p>
    </div>
</div>

{% if error %}
<div class="dashboard-card" style="border-color: rgba(239, 68, 68, 0.3); margin-bottom: 1.5rem;">
    <p style="color: #f87171; margin: 0;"><i class="fas fa-exclamation-circle"></i> {{ error }}</p>
</div>
{% endif %}

<div class="dashboard-card">
    <form method="POST" action="/admin/teachers/create-bulk">
        <div class="form-group">
            <label for="fullNames">ФИО (по одному на строку)</label>
            <textarea id="fullNames" name="full_names" rows="8" required
                      placeholder="Иван Петров&#10;Мария Сидорова&#10;Алексей Козлов"
                      style="width: 100%; resize: vertical;">{{ full_names or '' }}</textarea>
        </div>
        <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
            <button type="submit" class="btn-primary">
                <i class="fas fa-user-plus"></i> Создать аккаунты
            </button>
            <a href="/admin/dashboard" class="btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
